replicaCount: 1

# Deployment rollout strategy (apps/v1 DeploymentStrategy).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 3

nameOverride: ""
fullnameOverride: ""

# Applied to both Deployment and Pod metadata when non-empty.
annotations: {}

image:
  repository: harbor.instigaterevolution.com/instigaterevolution/dhcpr/dns
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8080
  dnsPort: 53

# Prometheus Operator ServiceMonitor for /metrics on the http port.
# `release` must match kube-prometheus-stack's serviceMonitorSelector.
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
  scrapeTimeout: ""
  labels:
    release: monitoring-kube-prometheus-stack
  annotations: {}

# In-namespace Gateway. Controllers matching gateway.className merge it onto
# their dataplane. For cert-manager gateway-shim, set annotations e.g.
#   cert-manager.io/cluster-issuer: <your-issuer>
gateway:
  enabled: false
  className: traefik
  # Traefik websecure entrypoint port (LB typically maps 443 → this).
  port: 8443
  # Listener port for dns-tcp / dns-udp when those routes are enabled.
  # Defaults to service.dnsPort when empty/omitted.
  dnsPort: 53
  # Defaults to httpRoute.host when empty.
  hostname: ""
  # Defaults to "<fullname>-tls" when empty.
  certificateSecretName: ""
  annotations: {}

# When gateway.enabled is true, parentRefs point at this chart's Gateway
# (sectionName: websecure). Otherwise parentRefs below are used as-is.
httpRoute:
  enabled: false
  host: dns.instigaterevolution.com
  annotations: {}
  parentRefs:
    - name: dhcpr
      sectionName: websecure

# Classic DNS over TCP (Gateway API TCPRoute). When gateway.enabled is true,
# parentRefs point at this chart's Gateway (sectionName: dns-tcp).
tcpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: dhcpr
      sectionName: dns-tcp

# Classic DNS over UDP (Gateway API UDPRoute). When gateway.enabled is true,
# parentRefs point at this chart's Gateway (sectionName: dns-udp).
udpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: dhcpr
      sectionName: dns-udp

# /data (DataPath) holds zones, dataprotection-keys/, and cache/ (root.zone, tips, …).
# Use ReadWriteMany if running more than one replica.
persistence:
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteMany

# Raw container env entries — standard Kubernetes EnvVar shape.
# Production appsettings bind DNS to loopback; override for in-cluster listen.
env:
  - name: DNS__ListenAddresses__0
    value: "udp://0.0.0.0:53"
  - name: DNS__ListenAddresses__1
    value: "tcp://0.0.0.0:53"
  - name: DNS__ListenAddresses__2
    value: "udp://[::]:53"
  - name: DNS__ListenAddresses__3
    value: "tcp://[::]:53"

# Optional bulk env from ConfigMaps/Secrets (Kubernetes EnvFromSource shape).
envFrom: []

# ASP.NET /health — resolves DNS:HealthCheck:Domains through the DNS pipeline.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources: {}
