replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: harbor.instigaterevolution.com/instigaterevolution/dhcpr/dns
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8080
  dnsPort: 53

# In-namespace Gateway (same pattern as ansible clusters/kube-lab/markdown-blog).
# Traefik merges it onto the shared dataplane; cert-manager gateway-shim issues TLS.
gateway:
  enabled: false
  className: traefik
  port: 8443
  # Defaults to httpRoute.host when empty.
  hostname: ""
  # Defaults to "<fullname>-tls" when empty.
  certificateSecretName: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns01-vultr

# When gateway.enabled is true, parentRefs point at this chart's Gateway
# (sectionName: websecure). Otherwise parentRefs below are used as-is.
httpRoute:
  enabled: false
  host: dns.instigaterevolution.com
  annotations: {}
  parentRefs:
    - name: dhcpr
      sectionName: websecure

# /data holds Data Protection keys and root-server cache. Use ReadWriteMany if
# running more than one replica.
persistence:
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteMany

# Raw container env entries — standard Kubernetes EnvVar shape.
# Production appsettings bind DNS to loopback; override for in-cluster listen.
env:
  - name: DNS__ListenAddresses__0
    value: "udp://0.0.0.0:53"
  - name: DNS__ListenAddresses__1
    value: "tcp://0.0.0.0:53"
  - name: DNS__ListenAddresses__2
    value: "udp://[::]:53"
  - name: DNS__ListenAddresses__3
    value: "tcp://[::]:53"

# Optional bulk env from ConfigMaps/Secrets (Kubernetes EnvFromSource shape).
envFrom: []

resources: {}
